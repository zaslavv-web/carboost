name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend-laravel/**'
      - 'deploy/deploy-laravel.sh'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run php artisan migrate --force'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      enable_delete:
        description: 'Use rsync --delete for backend code. Keep false unless server copy is clean.'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
      run_seed:
        description: 'Run php artisan demo:seed --only-content after deploy'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  FALLBACK_HOST: ssh.gro7659365.nichost.ru
  FALLBACK_USER: gro7659365
  FALLBACK_ROOT: /home/gro7659365/growth-peak.pro/docs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve deploy config
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          HOST="${SERVER_IP:-$FALLBACK_HOST}"
          USER_NAME="${SERVER_USER:-$FALLBACK_USER}"
          ROOT="${TARGET_DIR:-$FALLBACK_ROOT}"
          echo "DEPLOY_HOST=$HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$USER_NAME" >> "$GITHUB_ENV"
          echo "BACKEND_ROOT=$ROOT/backend" >> "$GITHUB_ENV"
          echo "Target: $USER_NAME@$HOST:$ROOT/backend"

      - name: Setup SSH (нативный ssh-agent, без Node-экшенов)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          KEY="${SSH_PRIVATE_KEY:-$DEPLOY_SSH_KEY}"
          if [ -z "$KEY" ]; then
            echo "::error::Neither SSH_PRIVATE_KEY nor DEPLOY_SSH_KEY is set"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          ssh-add -l
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t ssh-rsa -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -t rsa,ecdsa,ed25519 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<EOF
          Host $DEPLOY_HOST
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedAlgorithms +ssh-rsa
            PubkeyAcceptedKeyTypes +ssh-rsa
            CASignatureAlgorithms +ssh-rsa
            RequiredRSASize 1024
            UpdateHostKeys no
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload backend code
        run: |
          DELETE_FLAG=""
          if [ "${{ github.event.inputs.enable_delete }}" = "true" ]; then
            DELETE_FLAG="--delete --delete-excluded"
            echo "⚠️  Backend --delete enabled"
          else
            echo "ℹ️  Backend --delete disabled"
          fi

          ssh -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa -o CASignatureAlgorithms=+ssh-rsa -o RequiredRSASize=1024 -o UpdateHostKeys=no "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$BACKEND_ROOT'"

          rsync -avz \
            -e "ssh -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa -o CASignatureAlgorithms=+ssh-rsa -o RequiredRSASize=1024 -o UpdateHostKeys=no -o StrictHostKeyChecking=accept-new" \
            $DELETE_FLAG \
            --exclude '.env' \
            --exclude 'vendor/' \
            --exclude 'storage/' \
            --exclude 'bootstrap/cache/*.php' \
            backend-laravel/ "$DEPLOY_USER@$DEPLOY_HOST:$BACKEND_ROOT/"

      - name: Проверка каталога доставки
        run: |
          SSH_OPTS="-o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa -o CASignatureAlgorithms=+ssh-rsa -o RequiredRSASize=1024 -o UpdateHostKeys=no"

          # growth-peak.pro обслуживает SPA, а Laravel подключён только под /api.
          # Поэтому статический файл из backend/public не обязан открываться как
          # /deploy-marker-*.txt: такой тест проверял document root фронтенда и
          # ложно останавливал корректную доставку backend. Здесь проверяем
          # структуру каталога, а факт исполнения именно этой копии доказывает
          # финальный /api/health по VERSION + root_id.
          ROOT_ID="$(ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "BACKEND_ROOT='$BACKEND_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$BACKEND_ROOT"
          test -f artisan
          test -f public/index.php
          test -f routes/api.php
          php -r 'echo substr(sha1(realpath(".")), 0, 8), PHP_EOL;'
          REMOTE
          )"
          ROOT_ID="$(printf '%s' "$ROOT_ID" | tr -d '\r' | tail -n1)"
          echo "ROOT_ID (каталог доставки): $ROOT_ID"
          echo "DEPLOY_ROOT_ID=$ROOT_ID" >> "$GITHUB_ENV"

          # Диагностика прочих копий Laravel — печатаем всегда, она нужна при
          # возможном несовпадении root_id в финальном health-check.
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "BACKEND_ROOT='$BACKEND_ROOT' bash -s" <<'REMOTE'
          set -uo pipefail
          echo "--- каталог доставки: $BACKEND_ROOT"
          ls -l "$BACKEND_ROOT/VERSION" 2>/dev/null || echo "VERSION отсутствует (ещё не записан на этом шаге)"
          echo "--- другие копии Laravel в \$HOME (public/index.php + artisan рядом):"
          find "$HOME" -maxdepth 5 -name artisan -type f 2>/dev/null | while read -r a; do
            d="$(dirname "$a")"
            printf '%s  root_id=%s  version=%s\n' "$d" \
              "$(php -r 'echo substr(sha1(realpath($argv[1])),0,8);' "$d" 2>/dev/null)" \
              "$(head -c 40 "$d/VERSION" 2>/dev/null | tr -d '\n' || echo '-')"
          done
          REMOTE
          echo "Каталог доставки валиден; активный API-корень будет подтверждён после обновления через /api/health"


      - name: Install, migrate, refresh Laravel caches
        run: |
          RUN_MIGRATIONS="${{ github.event.inputs.run_migrations }}"
          if [ -z "$RUN_MIGRATIONS" ]; then RUN_MIGRATIONS="true"; fi
          RUN_SEED="${{ github.event.inputs.run_seed }}"
          if [ -z "$RUN_SEED" ]; then RUN_SEED="false"; fi

          ssh -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa -o CASignatureAlgorithms=+ssh-rsa -o RequiredRSASize=1024 -o UpdateHostKeys=no "$DEPLOY_USER@$DEPLOY_HOST" "BACKEND_ROOT='$BACKEND_ROOT' RUN_MIGRATIONS='$RUN_MIGRATIONS' RUN_SEED='$RUN_SEED' GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$BACKEND_ROOT"

          # Ручной `git pull` в каталоге приложения создаёт вложенную копию
          # $BACKEND_ROOT/backend-laravel: файлы обновляются, но Laravel их не
          # видит (миграции «Nothing to migrate», команды «not found»), а
          # автозагрузчик может подхватить дубли классов. Удаляем её.
          if [ -d "backend-laravel" ]; then
            echo "::warning::Найдена вложенная копия $BACKEND_ROOT/backend-laravel — удаляю (доставка только через этот workflow)"
            rm -rf "backend-laravel"
          fi

          # Проверяем именно активный корень приложения до запуска PHP. Это
          # останавливает deploy, если rsync попал во вложенный каталог или на
          # сервере осталась старая копия DbController.
          DB_CONTROLLER="app/Http/Controllers/Api/DbController.php"
          test -f "$DB_CONTROLLER" || {
            echo "::error::Активный DbController не найден: $BACKEND_ROOT/$DB_CONTROLLER"
            exit 1
          }
          grep -q 'function enforceResourceAccess' "$DB_CONTROLLER" || {
            echo "::error::В активном DbController отсутствует enforceResourceAccess — код развернут не в корень Laravel"
            exit 1
          }
          if grep -Eq 'function[[:space:]]+authorizeResource[[:space:]]*\(' "$DB_CONTROLLER"; then
            echo "::error::В активном DbController остался конфликтующий authorizeResource"
            exit 1
          fi
          echo "DbController deployment layout OK"

          php -v
          composer --version || true

          export COMPOSER_NO_AUDIT=1
          export COMPOSER_ALLOW_SUPERUSER=1
          # Композер на шаред-хостинге падает по памяти и оставляет битый vendor/composer
          # (Class "Composer\Autoload\ComposerStaticInit..." not found). Даём памяти и
          # обязательно перегенерируем автозагрузчик, затем проверяем его работоспособность.
          COMPOSER_BIN="$(command -v composer)"

          # КРИТИЧНО: сносим bootstrap/cache ДО composer install.
          # `--no-dev` удаляет dev-пакеты (pail, sail, collision, pint), а в
          # bootstrap/cache/packages.php|services.php остаётся их манифест.
          # Composer-скрипты запускаются с этим манифестом, package:discover
          # падает, кеш провайдеров сохраняется недособранным — и в рантайме
          # весь /api/* отдаёт 500 «Class "view" does not exist»
          # (ViewServiceProvider так и не зарегистрировался).
          rm -f bootstrap/cache/*.php

          php -d memory_limit=-1 "$COMPOSER_BIN" install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-scripts
          php -d memory_limit=-1 "$COMPOSER_BIN" dump-autoload --no-dev --optimize --no-interaction
          php -d memory_limit=-1 -r 'require "vendor/autoload.php"; if (!class_exists(Illuminate\Foundation\Application::class)) { fwrite(STDERR, "autoload broken\n"); exit(1);} echo "autoload OK\n";'

          # CLI использует отдельный php.ini (на этом хостинге memory_limit=64M),
          # поэтому артизан-команды и сидеры падают там, где веб (256M) живёт.
          # Держим единый лимит для всех вызовов артизана.
          ARTISAN="php -d memory_limit=1024M artisan"

          # Манифест пакетов пересобираем явно: install шёл с --no-scripts.
          $ARTISAN package:discover --ansi

          $ARTISAN optimize:clear || true
          $ARTISAN config:clear || true
          $ARTISAN cache:clear || true

          if [ "$RUN_MIGRATIONS" = "true" ]; then
            $ARTISAN migrate --force
          else
            echo "ℹ️  migrations skipped"
          fi

          $ARTISAN route:clear || true
          $ARTISAN config:cache
          $ARTISAN route:cache
          $ARTISAN view:cache || true
          $ARTISAN event:cache || true

          # Дымовой тест контейнера уже с прогретыми кешами: если сервис-провайдеры
          # собраны неполно (как было с "view"), падаем здесь, а не в проде.
          # vendor/autoload.php обязателен: bootstrap/app.php сам автолоадер не
          # подключает — это делают artisan и public/index.php. Без него php -r
          # падает на Application::configure с «class not found», и деплой
          # останавливается на исправном приложении.
          php -d memory_limit=1024M -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            foreach (["view", "files", "db", "router", "hash"] as $svc) {
              $app->make($svc);
            }
            echo "container smoke OK\n";
          ' || {
            echo "::error::Контейнер Laravel не резолвит базовые сервисы после сборки кешей — деплой остановлен"
            exit 1
          }


          # VERSION читает /api/health от имени веб-процесса, поэтому права
          # обязательны: без них health молча уходит в git-фолбэк и деплой
          # выглядит «не доехавшим».
          printf '%s\n' "${GITHUB_SHA:-unknown}" > VERSION
          chmod 644 VERSION
          ls -l VERSION
          php -r 'echo "root_id=", substr(sha1(realpath(".")),0,8), " version_readable=", var_export(is_readable("VERSION"), true), PHP_EOL;'

          # Ручной `git pull` на сервере делает вид, что код обновился: health
          # берёт версию из .git, когда VERSION недоступен. Явно сообщаем о
          # рассинхроне рабочей копии с доставленным коммитом.
          if [ -d .git ]; then
            SERVER_HEAD="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
            if [ "$SERVER_HEAD" != "${GITHUB_SHA:-unknown}" ]; then
              echo "::warning::В активном корне есть рабочая копия git (HEAD=$SERVER_HEAD), не совпадающая с доставкой ${GITHUB_SHA:-unknown}. Источник правды — этот workflow, ручной git pull использовать нельзя."
            fi
          fi

          # Обновление timestamp фронт-контроллера заставляет OPcache с
          # validate_timestamps подхватить новые классы после rsync.
          touch public/index.php
          $ARTISAN route:list --path=performance-cycles || true


          if [ "$RUN_SEED" = "true" ]; then
            echo "→ Running demo:seed --only-content"
            $ARTISAN demo:seed --only-content || {
              echo "::warning::demo:seed --only-content failed (non-fatal)"
            }
          else
            echo "ℹ️  demo:seed skipped"
          fi

          REMOTE

      - name: Set PHP runtime limits via .user.ini
        run: |
          ssh -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa -o CASignatureAlgorithms=+ssh-rsa -o RequiredRSASize=1024 -o UpdateHostKeys=no "$DEPLOY_USER@$DEPLOY_HOST" "BACKEND_ROOT='$BACKEND_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$BACKEND_ROOT"

          # Пишем .user.ini через printf: heredoc с нулевым отступом обрывал
          # блочный скаляр YAML и делал весь workflow-файл невалидным
          # (GitHub не показывал имя и кнопку Run workflow).
          printf '%s\n' \
            'memory_limit = 1024M' \
            'post_max_size = 64M' \
            'upload_max_filesize = 64M' \
            'max_execution_time = 120' > public/.user.ini


          chmod 644 public/.user.ini
          echo ".user.ini written:"
          cat public/.user.ini

          echo "CLI memory_limit: $(php -r 'echo ini_get(\"memory_limit\");')"
          echo "FPM memory_limit (via web): $(curl -fsS -H 'Accept: application/json' https://growth-peak.pro/api/health | grep -o '"memory_limit":"[^"]*"' || echo 'unknown')"
          REMOTE

      - name: Public health check
        run: |
          BODY="$(curl -fsS -H 'Accept: application/json' https://growth-peak.pro/api/health)"
          echo "$BODY"
          case "$BODY" in
            *"Fatal error"*|*"<br"*|*"<html"*)
              echo "::error::Backend вернул HTML вместо JSON — сломан autoload/vendor на сервере"
              exit 1;;
          esac
          if echo "$BODY" | grep -q '"memory_limit":"256M"'; then
            echo "::error::memory_limit всё ещё 256M (на этом хостинге Zend MM режет память кусками по 64M — нужен 1024M): $BODY"
            exit 1
          fi
          if ! echo "$BODY" | grep -q '"status":"ok"'; then
            echo "::error::Backend health degraded: $BODY"
            exit 1
          fi

          # `status=ok` доказывает только доступность старого процесса. Раньше
          # workflow завершался успешно, даже когда production продолжал
          # отвечать предыдущим коммитом. Сверяем фактически исполняемый код с
          # SHA текущей доставки и ждём короткое окно обновления OPcache.
          EXPECTED_VERSION="${GITHUB_SHA:0:7}"
          ACTUAL_VERSION=""
          VERSION_SOURCE=""
          SERVED_ROOT_ID=""
          for attempt in $(seq 1 12); do
            BODY="$(curl -fsS -H 'Accept: application/json' "https://growth-peak.pro/api/health?deploy_check=${GITHUB_SHA}&attempt=${attempt}")"
            ACTUAL_VERSION="$(printf '%s' "$BODY" | php -r '$d=json_decode(stream_get_contents(STDIN), true); echo (string)($d["checks"]["version"] ?? "");')"
            VERSION_SOURCE="$(printf '%s' "$BODY" | php -r '$d=json_decode(stream_get_contents(STDIN), true); echo (string)($d["checks"]["version_source"] ?? "");')"
            SERVED_ROOT_ID="$(printf '%s' "$BODY" | php -r '$d=json_decode(stream_get_contents(STDIN), true); echo (string)($d["checks"]["root_id"] ?? "");')"
            if [[ "$ACTUAL_VERSION" == "$EXPECTED_VERSION" || "$ACTUAL_VERSION" == "$GITHUB_SHA" ]]; then
              echo "Backend version verified: $ACTUAL_VERSION (source=$VERSION_SOURCE, root_id=$SERVED_ROOT_ID)"
              break
            fi
            echo "Waiting for backend version $EXPECTED_VERSION (currently ${ACTUAL_VERSION:-unknown}, source=${VERSION_SOURCE:-unknown}), attempt $attempt/12"
            sleep 5
          done

          if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" && "$ACTUAL_VERSION" != "$GITHUB_SHA" ]]; then
            echo "::error::Deployment did not reach production: expected $EXPECTED_VERSION, got ${ACTUAL_VERSION:-unknown} (source=${VERSION_SOURCE:-unknown}, served root_id=${SERVED_ROOT_ID:-unknown}, deploy root_id=${DEPLOY_ROOT_ID:-unknown}). Health endpoint is serving stale code."
            exit 1
          fi

          # Версия совпала — но если она пришла из git-фолбэка, значит файл
          # VERSION веб-процессу недоступен, и следующая выкатка снова
          # «зависнет» на старом коммите. Это ошибка, а не мелочь.
          if [[ "$VERSION_SOURCE" != "file" ]]; then
            echo "::error::Health отдал версию из источника '${VERSION_SOURCE:-unknown}', а не из файла VERSION: веб-процесс не читает VERSION в активном корне."
            exit 1
          fi

          if [[ -n "${DEPLOY_ROOT_ID:-}" && -n "$SERVED_ROOT_ID" && "$SERVED_ROOT_ID" != "$DEPLOY_ROOT_ID" ]]; then
            echo "::error::Веб исполняет другой каталог: served root_id=$SERVED_ROOT_ID, deploy root_id=$DEPLOY_ROOT_ID. Поправьте TARGET_DIR."
            exit 1
          fi

