name: Deploy Frontend

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend-laravel/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      enable_delete:
        description: 'Использовать rsync --delete (удалять на сервере файлы, которых нет в dist/). НЕ включайте на первом прогоне.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  FALLBACK_HOST: ssh.gro7659365.nichost.ru
  FALLBACK_USER: gro7659365
  FALLBACK_ROOT: /home/gro7659365/growth-peak.pro/docs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (vite → dist/)
        run: bun run build

      - name: Stamp version.json
        run: |
          SHA="${GITHUB_SHA::7}"
          printf '{"version":"%s","built_at":"%s"}\n' "$SHA" "$(date -u +%FT%TZ)" > dist/version.json
          cat dist/version.json

      - name: Cache headers (.htaccess для dist)
        run: |
          cat > dist/.htaccess.cache <<'EOF'
          # Managed by deploy-frontend workflow
          # Существующие файлы (version.json, manifest.json, robots.txt, ассеты)
          # отдаются напрямую и НЕ должны переписываться на index.html.
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]
          </IfModule>
          <IfModule mod_headers.c>
            <FilesMatch "^(index\.html|version\.json|manifest\.json)$">
              Header set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
              Header set Pragma "no-cache"
            </FilesMatch>
            <FilesMatch "\.(js|css|woff2?|png|jpg|jpeg|svg|webp)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
          </IfModule>
          EOF
          cat dist/.htaccess.cache

      - name: Sanity check dist/
        run: |
          test -f dist/index.html || { echo "❌ dist/index.html не собран"; exit 1; }
          test -f dist/version.json || { echo "❌ dist/version.json не создан"; exit 1; }
          echo "✅ dist собран, размер:"
          du -sh dist

      - name: Resolve deploy config
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          HOST="${SERVER_IP:-$FALLBACK_HOST}"
          USER_NAME="${SERVER_USER:-$FALLBACK_USER}"
          ROOT="${TARGET_DIR:-$FALLBACK_ROOT}"
          echo "DEPLOY_HOST=$HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$USER_NAME" >> "$GITHUB_ENV"
          echo "WEB_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Target: $USER_NAME@$HOST:$ROOT"

      - name: Setup SSH (нативный ssh-agent, без Node-экшенов)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          KEY="${SSH_PRIVATE_KEY:-$DEPLOY_SSH_KEY}"
          if [ -z "$KEY" ]; then
            echo "::error::Neither SSH_PRIVATE_KEY nor DEPLOY_SSH_KEY is set"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          ssh-add -l
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Trust host key (включая ssh-rsa для legacy серверов)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t ssh-rsa -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -t rsa,ecdsa,ed25519 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<EOF
          Host $DEPLOY_HOST
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedAlgorithms +ssh-rsa
            PubkeyAcceptedKeyTypes +ssh-rsa
            CASignatureAlgorithms +ssh-rsa
            RequiredRSASize 1024
            UpdateHostKeys no
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy (rsync, backend/ исключён)
        run: |
          DELETE_FLAG=""
          if [ "${{ github.event.inputs.enable_delete }}" = "true" ]; then
            DELETE_FLAG="--delete --delete-excluded"
            echo "⚠️  Режим --delete включён"
          else
            echo "ℹ️  --delete выключен (безопасный режим первого прогона)"
          fi
          rsync -avz \
            -e "ssh -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa -o CASignatureAlgorithms=+ssh-rsa -o RequiredRSASize=1024 -o UpdateHostKeys=no -o StrictHostKeyChecking=accept-new" \
            $DELETE_FLAG \
            --exclude 'backend' \
            --exclude 'backend/' \
            --exclude '.htaccess' \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$WEB_ROOT/"


      - name: Verify version.json on server (SSH)
        run: |
          SSH="ssh -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa -o CASignatureAlgorithms=+ssh-rsa -o RequiredRSASize=1024 -o UpdateHostKeys=no -o StrictHostKeyChecking=accept-new"
          SHA="${GITHUB_SHA::7}"
          OUT="$($SSH "$DEPLOY_USER@$DEPLOY_HOST" "ls -l '$WEB_ROOT/version.json' 2>&1; echo '---'; cat '$WEB_ROOT/version.json' 2>&1" || true)"
          echo "$OUT"
          if echo "$OUT" | grep -q "$SHA"; then
            echo "✅ version.json с версией $SHA лежит в веб-руте"
            echo "SERVER_VERSION_OK=true" >> "$GITHUB_ENV"
          else
            echo "::error::version.json в $WEB_ROOT отсутствует или содержит другую версию (ожидалась $SHA)"
            echo "SERVER_VERSION_OK=false" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Apply cache headers to server .htaccess (идемпотентно)
        run: |
          SSH="ssh -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa -o CASignatureAlgorithms=+ssh-rsa -o RequiredRSASize=1024 -o UpdateHostKeys=no -o StrictHostKeyChecking=accept-new"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "WEB_ROOT='$WEB_ROOT' bash -s" <<'REMOTE'
          set -e
          cd "$WEB_ROOT"
          touch .htaccess
          test -f .htaccess.cache || { echo "ℹ️  .htaccess.cache не найден — пропускаю"; exit 0; }

          # Вырезаем ранее добавленный управляемый блок (он мог быть старой версии,
          # без pass-through для существующих файлов) и подставляем свежий.
          awk '
            /# Managed by deploy-frontend workflow/ { skip=1; closes=0; next }
            skip==1 {
              if ($0 ~ /<\/IfModule>/) { closes++; if (closes>=2) { skip=0 } }
              next
            }
            { print }
          ' .htaccess > .htaccess.rest

          cat .htaccess.cache .htaccess.rest > .htaccess.new && mv .htaccess.new .htaccess
          rm -f .htaccess.rest .htaccess.cache
          echo '✅ Управляемый блок .htaccess обновлён'
          head -20 .htaccess
          REMOTE

      - name: Post-deploy check
        run: |
          echo "Проверяю, что боевой сайт отдаёт свежую версию…"
          SHA="${GITHUB_SHA::7}"
          STATUS="unknown"
          for i in 1 2 3 4 5; do
            META="$(curl -s -o /tmp/ver.txt -w '%{http_code} %{content_type}' --max-time 20 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "https://growth-peak.pro/version.json?t=$(date +%s)-$i" || true)"
            BODY="$(tr -d '\r\n' < /tmp/ver.txt || true)"
            echo "попытка $i: [$META] тело: $(echo "$BODY" | head -c 200)"
            if [ -z "$BODY" ]; then
              STATUS="empty"
            elif echo "$BODY" | grep -q "$SHA"; then
              STATUS="ok"; break
            elif echo "$BODY" | grep -qi '<!doctype html\|<html'; then
              STATUS="html"
            else
              STATUS="mismatch"
            fi
            sleep 5
          done

          CC=$(curl -sI --max-time 20 "https://growth-peak.pro/" | tr -d '\r' | grep -i '^cache-control' || true)
          echo "index.html $CC"

          case "$STATUS" in
            ok)
              echo "✅ Deploy завершён — сайт отдаёт версию $SHA"
              ;;
            html|empty)
              # Файлы уже подтверждены на сервере предыдущим шагом, значит проблема
              # в правилах перезаписи или кэше фронтового прокси — не валим деплой.
              if [ "${SERVER_VERSION_OK:-false}" = "true" ]; then
                echo "::warning::version.json на сервере корректный ($SHA), но по HTTP пришёл '$STATUS' (SPA-фолбэк или кэш прокси). Деплой считаю успешным."
              else
                echo "::error::version.json недоступен по HTTP ($STATUS) и не подтверждён на сервере"; exit 1
              fi
              ;;
            *)
              echo "::error::Сайт отдаёт другую версию (ожидалась $SHA)"; exit 1
              ;;
          esac
