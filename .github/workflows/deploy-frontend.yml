name: Deploy Frontend

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend-laravel/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      enable_delete:
        description: 'Использовать rsync --delete (удалять на сервере файлы, которых нет в dist/). НЕ включайте на первом прогоне.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  FALLBACK_HOST: ssh.gro7659365.nichost.ru
  FALLBACK_USER: gro7659365
  FALLBACK_ROOT: /home/gro7659365/growth-peak.pro/docs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (vite → dist/)
        run: bun run build

      - name: Stamp version.json
        run: |
          SHA="${GITHUB_SHA::7}"
          printf '{"version":"%s","built_at":"%s"}\n' "$SHA" "$(date -u +%FT%TZ)" > dist/version.json
          cat dist/version.json

      - name: Собрать .htaccess для сервера
        run: |
          # Единственный источник правил — public/.htaccess (там же и кэш-заголовки).
          # Никаких вторых RewriteEngine-блоков: дубли правил давали петли редиректов.
          cat > dist/.htaccess.cache <<'EOF'
          # Managed by deploy-frontend workflow — не правьте на сервере, правьте public/.htaccess
          EOF
          cat public/.htaccess >> dist/.htaccess.cache
          cat dist/.htaccess.cache
          HTACCESS_SHA="$(sha256sum dist/.htaccess.cache | awk '{print $1}')"
          echo "HTACCESS_SHA=$HTACCESS_SHA" >> "$GITHUB_ENV"
          echo "sha256: $HTACCESS_SHA"

      - name: Sanity check dist/
        run: |
          test -f dist/index.html || { echo "❌ dist/index.html не собран"; exit 1; }
          test -f dist/version.json || { echo "❌ dist/version.json не создан"; exit 1; }
          echo "✅ dist собран, размер:"
          du -sh dist

      - name: Resolve deploy config
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          HOST="${SERVER_IP:-$FALLBACK_HOST}"
          USER_NAME="${SERVER_USER:-$FALLBACK_USER}"
          ROOT="${TARGET_DIR:-$FALLBACK_ROOT}"
          echo "DEPLOY_HOST=$HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$USER_NAME" >> "$GITHUB_ENV"
          echo "WEB_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Target: $USER_NAME@$HOST:$ROOT"

      - name: Setup SSH (нативный ssh-agent, без Node-экшенов)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          KEY="${SSH_PRIVATE_KEY:-$DEPLOY_SSH_KEY}"
          if [ -z "$KEY" ]; then
            echo "::error::Neither SSH_PRIVATE_KEY nor DEPLOY_SSH_KEY is set"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          ssh-add -l
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Trust host key (включая ssh-rsa для legacy серверов)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t ssh-rsa -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -t rsa,ecdsa,ed25519 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<EOF
          Host $DEPLOY_HOST
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedAlgorithms +ssh-rsa
            PubkeyAcceptedKeyTypes +ssh-rsa
            CASignatureAlgorithms +ssh-rsa
            RequiredRSASize 1024
            UpdateHostKeys no
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy (rsync, backend/ исключён)
        run: |
          DELETE_FLAG=""
          if [ "${{ github.event.inputs.enable_delete }}" = "true" ]; then
            DELETE_FLAG="--delete --delete-excluded"
            echo "⚠️  Режим --delete включён"
          else
            echo "ℹ️  --delete выключен (безопасный режим первого прогона)"
          fi
          rsync -avz \
            -e "ssh -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa -o CASignatureAlgorithms=+ssh-rsa -o RequiredRSASize=1024 -o UpdateHostKeys=no -o StrictHostKeyChecking=accept-new" \
            $DELETE_FLAG \
            --exclude 'backend' \
            --exclude 'backend/' \
            --exclude '.htaccess' \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$WEB_ROOT/"


      - name: Убрать старый симлинк/папку frontend/ (причина петли редиректов)
        run: |
          SSH="ssh -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa -o CASignatureAlgorithms=+ssh-rsa -o RequiredRSASize=1024 -o UpdateHostKeys=no -o StrictHostKeyChecking=accept-new"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "WEB_ROOT='$WEB_ROOT' bash -s" <<'REMOTE'
          cd "$WEB_ROOT"
          if [ -e frontend ] || [ -L frontend ]; then
            echo "⚠️  Найден frontend/ — удаляю (новый .htaccess его не использует)"
            ls -ld frontend
            rm -rf frontend
            echo "✅ frontend/ удалён"
          else
            echo "ℹ️  frontend/ не найден — пропускаю"
          fi
          REMOTE

      - name: Гарантировать version.json в веб-руте (SSH)
        run: |
          SSH="ssh -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa -o CASignatureAlgorithms=+ssh-rsa -o RequiredRSASize=1024 -o UpdateHostKeys=no -o StrictHostKeyChecking=accept-new"
          SHA="${GITHUB_SHA::7}"
          TS="$(date -u +%FT%TZ)"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "WEB_ROOT='$WEB_ROOT' SHA='$SHA' TS='$TS' bash -s" <<'REMOTE'
          set -e
          cd "$WEB_ROOT"
          # Если rsync не доехал или файл был в frontend/, пересоздаём напрямую.
          printf '{"version":"%s","built_at":"%s"}\n' "$SHA" "$TS" > version.json
          echo "✅ version.json записан в $WEB_ROOT:"
          cat version.json
          ls -l version.json
          REMOTE

      - name: Применить .htaccess на сервере
        run: |
          set -euo pipefail
          SSH="ssh -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa -o CASignatureAlgorithms=+ssh-rsa -o RequiredRSASize=1024 -o UpdateHostKeys=no -o StrictHostKeyChecking=accept-new"
          # Содержимое передаём прямо в SSH-сессию (base64), не полагаясь на rsync.
          B64="$(base64 -w0 dist/.htaccess.cache)"
          RC=0
          OUT="$($SSH "$DEPLOY_USER@$DEPLOY_HOST" "WEB_ROOT='$WEB_ROOT' B64='$B64' bash -s" 2>&1 <<'REMOTE'
          set -e
          cd "$WEB_ROOT"
          printf '%s' "$B64" | base64 -d > .htaccess.new
          if [ ! -s .htaccess.new ]; then
            echo "::error::.htaccess.new пуст после декодирования"; exit 1
          fi
          if ! grep -q 'RewriteEngine' .htaccess.new; then
            echo "::error::в .htaccess.new нет RewriteEngine — доставка повреждена"; exit 1
          fi
          if [ -f .htaccess ]; then cp .htaccess .htaccess.bak; fi
          mv .htaccess.new .htaccess
          rm -f .htaccess.cache
          echo '✅ .htaccess обновлён (бэкап: .htaccess.bak)'
          head -n 20 .htaccess
          if command -v sha256sum >/dev/null 2>&1; then
            echo "REMOTE_SHA=$(sha256sum .htaccess | awk '{print $1}')"
          elif command -v shasum >/dev/null 2>&1; then
            echo "REMOTE_SHA=$(shasum -a 256 .htaccess | awk '{print $1}')"
          else
            echo "REMOTE_SHA=unknown"
          fi
          REMOTE
          )" || RC=$?
          echo "$OUT"
          if [ "$RC" != "0" ]; then
            echo "::error::шаг применения .htaccess на сервере завершился с кодом $RC"
            exit "$RC"
          fi
          REMOTE_SHA="$(echo "$OUT" | sed -n 's/^REMOTE_SHA=//p' | tail -n1)"
          if [ "$REMOTE_SHA" = "unknown" ] || [ -z "$REMOTE_SHA" ]; then
            echo "⚠️  Не удалось посчитать контрольную сумму на сервере — пропускаю сверку"
          elif [ "$REMOTE_SHA" != "$HTACCESS_SHA" ]; then
            echo "::error::.htaccess на сервере отличается от собранного (ожидалось $HTACCESS_SHA, получено $REMOTE_SHA)"
            exit 1
          else
            echo "✅ Контрольная сумма .htaccess совпала: $REMOTE_SHA"
          fi

      - name: Диагностика раскладки и версии на сервере (SSH)
        run: |
          SSH="ssh -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa -o CASignatureAlgorithms=+ssh-rsa -o RequiredRSASize=1024 -o UpdateHostKeys=no -o StrictHostKeyChecking=accept-new"
          SHA="${GITHUB_SHA::7}"
          OUT="$($SSH "$DEPLOY_USER@$DEPLOY_HOST" "
            echo '== web root:'; ls -l '$WEB_ROOT/version.json' '$WEB_ROOT/index.html' 2>&1;
            echo '== version.json:'; cat '$WEB_ROOT/version.json' 2>&1;
            echo '== frontend/ (частая причина петли редиректов, если это симлинк на корень):';
            ls -ld '$WEB_ROOT/frontend' 2>&1; readlink -f '$WEB_ROOT/frontend' 2>&1;
            echo '== tail error_log:'; tail -n 20 '$WEB_ROOT/../logs/error_log' 2>/dev/null || tail -n 20 '$WEB_ROOT/error_log' 2>/dev/null || echo 'error_log не найден'
          " || true)"
          echo "$OUT"
          if echo "$OUT" | grep -q "$SHA"; then
            echo "✅ version.json с версией $SHA лежит в веб-руте"
            echo "SERVER_VERSION_OK=true" >> "$GITHUB_ENV"
          else
            echo "::error::version.json в $WEB_ROOT отсутствует или содержит другую версию (ожидалась $SHA)"
            echo "SERVER_VERSION_OK=false" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Post-deploy check (HTTP)
        run: |
          SHA="${GITHUB_SHA::7}"
          STATUS="unknown"; CODE=""
          for i in 1 2 3 4 5; do
            CODE="$(curl -s -o /tmp/ver.txt -w '%{http_code}' --max-time 20 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "https://growth-peak.pro/version.json?t=$(date +%s)-$i" || true)"
            BODY="$(tr -d '\r\n' < /tmp/ver.txt || true)"
            echo "попытка $i: HTTP $CODE, тело: $(echo "$BODY" | head -c 200)"
            if echo "$BODY" | grep -q "$SHA"; then STATUS="ok"; break
            elif [ "${CODE:0:1}" = "5" ]; then STATUS="server_error"
            elif [ -z "$BODY" ]; then STATUS="empty"
            elif echo "$BODY" | grep -qi '<!doctype html\|<html'; then STATUS="html"
            else STATUS="mismatch"; fi
            sleep 5
          done

          echo "— смоук боевых урлов —"
          FAIL=0
          for u in "/" "/api/health" "/manifest.json" "/robots.txt" "/dashboard"; do
            C="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://growth-peak.pro$u" || true)"
            echo "  $u → $C"
            case "$C" in 5*) FAIL=1;; esac
          done
          curl -sI --max-time 20 "https://growth-peak.pro/" | tr -d '\r' | grep -i '^cache-control' || true

          case "$STATUS" in
            ok)
              echo "✅ Сайт отдаёт версию $SHA"
              ;;
            server_error)
              echo "::error::version.json отдаёт HTTP $CODE — ошибка сервера (проверьте петлю редиректов в .htaccess и error_log выше)"; exit 1
              ;;
            html)
              echo "::error::version.json перехватывается SPA-фолбэком (отдан index.html) — правило pass-through в .htaccess не работает"; exit 1
              ;;
            *)
              echo "::error::version.json недоступен ($STATUS, HTTP $CODE), ожидалась версия $SHA"; exit 1
              ;;
          esac

          [ "$FAIL" = "0" ] || { echo "::error::какой-то из боевых урлов отдаёт 5xx"; exit 1; }
          echo "✅ Смоук боевых урлов пройден"
